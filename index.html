<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0c0c0c" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)" />
  <meta name="color-scheme" content="dark light" />
  <title>chiyan loo</title>
  <meta name="description" content="chiyan loo — student, ml research, software." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23ececec'/%3E%3Ctext x='16' y='16' fill='%230c0c0c' font-family='Helvetica,Arial,sans-serif' font-size='20' font-weight='500' text-anchor='middle' dominant-baseline='central'%3Ec%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..600&display=swap" />
  <script>
    try { var t = localStorage.getItem("theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <style>
    :root {
      --bg: #0c0c0c;
      --fg: #ececec;
      --muted: #8a8a8a;
      --faint: #5e5e5e;
      --rule: #232323;
      --rule-strong: #3a3a3a;
      --accent: #7dd3a8;
      --font: "Newsreader", Georgia, "Times New Roman", serif;
      --ease: cubic-bezier(.4, 0, .2, 1);
      --glow-1: rgba(255, 170, 90, .13);
      --glow-2: rgba(222, 126, 64, .08);
      --show-sun: block;
      --show-moon: none;
      color-scheme: dark;
    }
    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]) {
        --bg: #f6f4ef;
        --fg: #1b1b1b;
        --muted: #6a6a6a;
        --faint: #9a9792;
        --rule: #e3e0d9;
        --rule-strong: #c6c2b9;
        --accent: #2f8a5f;
        --glow-1: rgba(240, 140, 60, .16);
        --glow-2: rgba(222, 110, 50, .08);
        --show-sun: none;
        --show-moon: block;
        color-scheme: light;
      }
    }
    :root[data-theme="light"] {
      --bg: #f6f4ef;
      --fg: #1b1b1b;
      --muted: #6a6a6a;
      --faint: #9a9792;
      --rule: #e3e0d9;
      --rule-strong: #c6c2b9;
      --accent: #2f8a5f;
      --glow-1: rgba(240, 140, 60, .16);
      --glow-2: rgba(222, 110, 50, .08);
      --show-sun: none;
      --show-moon: block;
      color-scheme: light;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font);
      font-size: 1.125rem;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      transition: background-color .2s var(--ease), color .2s var(--ease);
    }
    h1, h2, p { margin: 0; font-size: inherit; font-weight: 400; }
    a { color: inherit; text-decoration: none; }
    ::selection { background: var(--fg); color: var(--bg); }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 2px; }
    [id] { scroll-margin-top: 3rem; }

    .page {
      position: relative;
      z-index: 1;
      max-width: 780px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem 6rem;
    }

    /* header */
    .header { display: flex; justify-content: space-between; align-items: center; gap: 1.5rem; }
    .header nav { display: flex; gap: 1.125rem; }
    .header a { transition: color .16s var(--ease); }
    .header nav a { color: var(--muted); }
    .header a:hover { color: var(--fg); }
    .brand { display: flex; align-items: center; gap: .75rem; }
    .theme-toggle {
      display: inline-flex; padding: 0; border: 0; background: none; cursor: pointer;
      color: var(--muted); transition: color .16s var(--ease);
    }
    .theme-toggle:hover { color: var(--fg); }
    .theme-toggle svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .theme-toggle .sun { display: var(--show-sun); }
    .theme-toggle .moon { display: var(--show-moon); }

    /* intro */
    .intro { margin-top: 7rem; }
    .intro p + p { margin-top: 1.25rem; }
    .intro .muted { color: var(--muted); }

    .link {
      text-decoration: underline;
      text-decoration-color: var(--rule-strong);
      text-underline-offset: 3px;
      transition: text-decoration-color .16s var(--ease);
    }
    .link:hover { text-decoration-color: var(--fg); }

    .status {
      display: inline-flex; align-items: center; gap: .5rem;
      color: var(--muted);
    }
    .status::before {
      content: ""; width: 6px; height: 6px; border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
    }

    /* contact */
    .contact { margin-top: 5rem; color: var(--muted); }
    .contact a { color: var(--fg); }
    .contact .sep { color: var(--faint); margin: 0 .5rem; }

    .icons { display: flex; gap: 1rem; align-items: center; }
    .icons a { color: var(--muted); display: inline-flex; transition: color .16s var(--ease), transform .16s var(--ease); }
    .icons a:hover { color: var(--fg); transform: translateY(-1px); }
    .icons svg { width: 20px; height: 20px; fill: currentColor; }
    .icons a.text:hover { transform: none; }
    .icons a[aria-current="page"] { color: var(--fg); }


    /* warm glow at the bottom of the viewport */
    .glow {
      position: fixed; inset: auto 0 0 0; height: 70vh;
      pointer-events: none; z-index: 0;
      background:
        radial-gradient(90% 75% at 50% 118%, var(--glow-1), transparent 62%),
        radial-gradient(140% 95% at 50% 130%, var(--glow-2), transparent 66%);
      transform-origin: bottom;
      animation: breathe 12s ease-in-out infinite;
    }
    @keyframes breathe {
      0%, 100% { opacity: .6; transform: scaleY(.8); }
      50% { opacity: 1; transform: scaleY(1.15); }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .glow { animation: none; opacity: .8; }
    }

    @media (max-width: 520px) {
      body { font-size: 1.0625rem; }
      .intro { margin-top: 5rem; }
    }
  </style>
</head>
<body>
  <div class="glow" aria-hidden="true"></div>

  <main class="page">
    <header class="header">
      <div class="brand">
        <a href="/">chiyan loo</a>
        <button class="theme-toggle" type="button" aria-label="toggle light/dark mode">
          <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
          <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
        </button>
      </div>
      <nav class="icons" aria-label="site">
        <a href="/" class="text" aria-current="page">about</a>
        <a href="/blog/" class="text">blog</a>
      </nav>
    </header>

    <section class="intro">
      <p>hi, I'm Chiyan.</p>
      <p>
        I'm a student interested in post training and reasoning models. My current research focuses on llm self-distillation and RL.
      </p>
    </section>

    <p class="contact">
      want to chat? <a class="link" href="mailto:loochiyan@gmail.com">send me an email</a>
      <span class="sep">/</span><a class="link" href="https://github.com/chiyan-loo">github</a>
      <span class="sep">/</span><a class="link" href="https://www.linkedin.com/in/chiyan-loo/">linkedin</a>
    </p>

  </main>

  <script>
    (function () {
      var root = document.documentElement;
      var mq = window.matchMedia("(prefers-color-scheme: light)");
      document.querySelector(".theme-toggle").addEventListener("click", function () {
        var system = mq.matches ? "light" : "dark";
        var next = (root.dataset.theme || system) === "light" ? "dark" : "light";
        try {
          // choosing the system theme clears the override so the page follows the OS again
          if (next === system) localStorage.removeItem("theme"); else localStorage.setItem("theme", next);
        } catch (e) {}
        if (next === system) delete root.dataset.theme; else root.dataset.theme = next;
      });
    })();
  </script>
</body>
</html>
