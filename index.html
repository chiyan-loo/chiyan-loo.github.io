  <style>
    :root {
      --bg: #0c0c0c;
      --fg: #ececec;
      --muted: #8a8a8a;
      --faint: #5e5e5e;
      --rule: #232323;
      --rule-strong: #3a3a3a;
      --accent: #7dd3a8;
      --font: "Newsreader", Georgia, "Times New Roman", serif;
      --ease: cubic-bezier(.4, 0, .2, 1);
      color-scheme: dark;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font);
      font-size: 1.125rem;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    h1, h2, p { margin: 0; font-size: inherit; font-weight: 400; }
    a { color: inherit; text-decoration: none; }
    ::selection { background: var(--fg); color: var(--bg); }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 2px; }
    [id] { scroll-margin-top: 3rem; }

    .page {
      position: relative;
      z-index: 1;
      max-width: 780px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem 6rem;
    }

    /* header */
    .header { display: flex; justify-content: space-between; align-items: center; gap: 1.5rem; }
    .header nav { display: flex; gap: 1.125rem; }
    .header a { transition: color .16s var(--ease); }
    .header nav a { color: var(--muted); }
    .header a:hover { color: var(--fg); }

    /* intro */
    .intro { margin-top: 7rem; }
    .intro p + p { margin-top: 1.25rem; }
    .intro .muted { color: var(--muted); }

    .link {
      text-decoration: underline;
      text-decoration-color: var(--rule-strong);
      text-underline-offset: 3px;
      transition: text-decoration-color .16s var(--ease);
    }
    .link:hover { text-decoration-color: var(--fg); }

    .status {
      display: inline-flex; align-items: center; gap: .5rem;
      color: var(--muted);
    }
    .status::before {
      content: ""; width: 6px; height: 6px; border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
    }

    /* contact */
    .contact { margin-top: 5rem; color: var(--muted); }
    .contact a { color: var(--fg); }
    .contact .sep { color: var(--faint); margin: 0 .5rem; }

    .icons { display: flex; gap: 1rem; align-items: center; }
    .icons a { color: var(--muted); display: inline-flex; transition: color .16s var(--ease), transform .16s var(--ease); }
    .icons a:hover { color: var(--fg); transform: translateY(-1px); }
    .icons svg { width: 20px; height: 20px; fill: currentColor; }


    /* warm glow at the bottom of the viewport */
    .glow {
      position: fixed; inset: auto 0 0 0; height: 70vh;
      pointer-events: none; z-index: 0;
      background:
        radial-gradient(90% 75% at 50% 118%, rgba(255, 170, 90, .13), transparent 62%),
        radial-gradient(140% 95% at 50% 130%, rgba(222, 126, 64, .08), transparent 66%);
      transform-origin: bottom;
      animation: breathe 12s ease-in-out infinite;
    }
    @keyframes breathe {
      0%, 100% { opacity: .6; transform: scaleY(.8); }
      50% { opacity: 1; transform: scaleY(1.15); }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .glow { animation: none; opacity: .8; }
    }

    @media (max-width: 520px) {
      body { font-size: 1.0625rem; }
      .intro { margin-top: 5rem; }
    }
  </style>
</head>
